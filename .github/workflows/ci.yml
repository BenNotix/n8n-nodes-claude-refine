name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Behavioral tests of the Chat Model sub-node against the real
      # @n8n/ai-utilities adapter — catches SDK->LangChain contract breaks
      # (lost tool calls, thinking replay, caching placement) that lint
      # and tsc cannot see
      - run: npm test
